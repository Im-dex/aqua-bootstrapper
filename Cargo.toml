[package]
name = "aqua-bootstrapper"
version = "1.0.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sigstore-verification = "0.2.8"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.46", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.20"
