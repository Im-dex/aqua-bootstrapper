[package]
name = "aqua-bootstrapper"
version = "2.0.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
minijinja = { version = "2.21.0", default-features = false, features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "macros", "process", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1.1.9"
tar = "0.4.46"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
